# Doc Pool 3 컬렉션 — 수집·색인 R2 / 자료 선별 R3(ecosystem·context)
# 설계서 §3. 색인 대상은 이 파일에 있는 것뿐이다.
# 3 컬렉션 쪽수 합계 200쪽 가드. 웹 문서는 3,200자 = 1쪽 환산.

# ── papers_core: 선정 2건 + 비교 참조 2건 ────────────────────────
# role=primary 는 정독·평가셋 대상, role=reference 는 비교 인용용(해당 절만).
# DeepSeek-V2(~50쪽)는 쪽수 압박이 크고 아키텍처 계열이라 비교축이 달라 제외했다.
papers_core:
  - id: turboquant
    role: primary
    technology: TurboQuant
    title: "TurboQuant: Online Vector Quantization with Near-optimal Distortion Rate"
    arxiv: "2504.19874"
    url: "https://arxiv.org/pdf/2504.19874"
    venue: "arXiv preprint"
    published: "2025-04"

  - id: itme
    role: primary
    technology: ITME
    title: "ITME: Inference Tiered Memory Expansion with Disaggregated CXL-Hybrid Memories"
    arxiv: "2606.12556"
    url: "https://arxiv.org/pdf/2606.12556"
    venue: "arXiv preprint"
    published: "2026-06"

  - id: kivi
    role: reference
    technology: TurboQuant      # SW 양자화 계열 비교축
    title: "KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache"
    arxiv: "2402.02750"
    url: "https://arxiv.org/pdf/2402.02750"
    venue: "ICML 2024"
    published: "2024-02"

  - id: infinigen
    role: reference
    technology: ITME            # HW 메모리 확장 계열 비교축 + TRL 시차(2024 vs 2026)
    title: "InfiniGen: Efficient Generative Inference of LLMs with Dynamic KV Cache Management"
    arxiv: "2406.19707"
    url: "https://arxiv.org/pdf/2406.19707"
    venue: "OSDI 2024"
    published: "2024-06"

