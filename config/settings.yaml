# 실행 설정
# 모델은 .env 의 LLM_MODEL 로 덮어쓸 수 있다.
#
# 섹션 담당 (docs/agent/orchestrator-workers-plan.md §11-4 공유 파일 규칙)
#   llm · orchestrator  → 담당 A (agent/ow-orchestration)
#   report · quality    → 담당 C (agent/ow-quality)
#   그 외 기존 섹션      → 이번 작업에서 수정하지 않는다
# 자기 섹션 밖의 줄은 건드리지 않는다 — 다른 hunk 로 두어 merge 충돌을 피한다.

# ── llm: 담당 A ──────────────────────────────────────────────────────────────
llm:
  model: gpt-4.1-mini         # 계획·생성·종합·Judge 공통. temperature·seed 를 실제로 전달하는 비추론형 모델
  judge_model: null           # null 이면 model 을 쓴다. Judge 만 다른 모델로 바꿀 때 지정
  temperature: 0
  seed: 20260922              # 재현용 고정값. 바꾸면 같은 근거에서도 문장이 달라진다.
                              # temperature=0 만으로는 같은 출력이 보장되지 않는다.
  timeout: 180                # 호출 하나의 상한(초). stakeholder 초안(근거 40k 자)은 60초를 넘겼다(20261007 실행)
  max_retries: 1              # SDK 내부 재시도. 그래프 재시도(재계획 라운드)와 별개

retrieval:
  top_k: 5                    # dense 코사인 전용. RRF 상수는 R3 검색에서 읽지 않아 제거했다.

# 실행 단위 설정 — app.py 가 run_config 로 묶어 State 에 넣는다 (R1)
run:
  runs_dir: runs              # runs/<run_id>/ 아래에 원문 스냅샷·결과·trace 를 남긴다
  technologies:               # 설계서 §2 — 설정에 고정 등록해 모든 결과물에서 같은 비교 대상을 쓴다
    - TurboQuant
    - ITME
  web_top_k: 3                # 기술×주체별 웹 검색 후보 수
  web_context_chars: 40000    # 모델에 전달할 근거 XML 총 문자 수
  web:                        # 이해관계자 웹 수집 한도 (R3 계약)
    max_sources: 24           # 성공한 원문 수
    max_fetches: 40           # 본문 수집 시도 수. 실패도 집계
    max_searches: 16          # 2기술×4주체 최초 8회 + 보완 최대 8회
    max_body_chars: 50000     # 원문 한 건의 추출 본문 길이
    max_total_chars: 300000   # 실행 전체 본문 문자 수
    max_response_bytes: 2000000
    min_body_chars: 120       # 빈 문서·짧은 오류 페이지 차단
    timeout: 15               # HTTP 연결/read timeout(초)

limits:
  max_pages: 200              # 색인 대상 전체(3 컬렉션) 합계 상한
  web_chars_per_page: 3200    # 웹 문서 쪽수 환산
  chunk_tokens: 400
  chunk_overlap: 80
  chunk_hard_cap: 512         # 임베딩 입력 한도. 초과분은 의미 단위에서 재분할
  retrieval_round: 2          # 기술 조사 최초 1회 + 질의 보완 1회 (설계서 §8)
  validation_round: 2         # 최초 1회 + 인용 수정 1회

# ── orchestrator: 담당 A ─────────────────────────────────────────────────────
# Orchestrator-Workers 제어 상한. 값은 계획서 §8. split 은 A 가 0단계 이후 보정한다.
orchestrator:
  max_retry: 2                # MAX_RETRY — 재계획 라운드 (State.retry_count)
  max_workers: 8              # MAX_WORKERS — 한 라운드의 Task·Worker 수
  max_repairs: 2              # synthesis·report 저비용 수리 (State.repair_count)
  max_steps: 12               # State.step_count — 정상 종료 가드
  max_guard_retries: 2        # publish guard 구버전 → 보고서 재생성 (State.guard_retry_count)
  recursion_limit: 60         # 그래프 안전장치. langgraph 1.2.12 기본값은 10007 이라 명시한다
  max_searches: 16            # 실행 전체 웹 검색 상한 (라운드마다 새로 주지 않는다)
  max_judge_retries: 1
  split:                      # 근거 가용성 사전 조사 → Task 개수 규칙 (계획서 §4-1)
    tau: 0.84                 # 유사도 임계값. 보정 기록 docs/agent/lane-a-calibration.md
    T: 3                      # 기술별 청크 수 기준. tau=0.84 에서 2·3·4 결과가 같아 중간값

# ── report: 담당 C ───────────────────────────────────────────────────────────
# 10쪽 상한용 표시 상한 (계획서 §7-2). 압축 단계 0(기본)·1(절반)·2(최소 표시 수준).
# 최소 표시 수준 = 관점×기술 칸마다 1개 + SUMMARY + REFERENCE. 압축하지 않는 것:
# SUMMARY·REFERENCE·편향 예외 문구. 최종 보장은 값이 아니라 렌더링 쪽수 검사다.
# 아래 값은 지난 제출본(14쪽, 칸당 Claim 제한 없음)을 기준으로 잡은 잠정값이다. pango 가 있는
# 환경에서 `uv run python -m src.output.pdf --measure` 로 9쪽 이하인지 실측해 고정한다.
report:
  max_pages: 10
  max_claims_per_cell: 3      # 관점×기술 칸당 본문 표시 Claim 수 (압축 1단계는 절반, 2단계는 1)
  max_implications: 4         # §5.1·§5.2 각각의 표시 수
  max_gaps: 12                # §6 Gap 표시 수. 넘으면 "외 n건" 으로 접는다
  max_quote_chars: 1500       # Claim 본문 표시 길이 상한(문자). Claim 은 절 단위(1~2천 자)라 240 이면 문장 중간에서 잘린다
  max_compaction: 2           # 압축 단계 상한

# ── quality: 담당 C ──────────────────────────────────────────────────────────
# 품질 평가 기준 (계획서 §7-1). README 에 그대로 공개한다.
quality:
  judge: true                 # false 면 코드 기반 평가(1안)만. run_config.quality_judge 가 우선
  judge_sample: 60            # L1 Judge 전수 상한. 넘으면 관점×기술 층화 결정적 표본(recheck 는 항상 포함)
  bias:
    min_source_groups: 2      # 지표 ① 기술별 인용 근거의 출처 묶음 수
    max_group_share: 0.6      # 지표 ② 단일 묶음 비중 (인용 evidence 건수 기준)
  # source_id → 출처 묶음. 논문은 1저자 소속(원문 첫 쪽 확인, 2026-10-07), 그 밖은 발행 주체.
  # 여기 없는 출처(웹 수집 등)는 URL 도메인을, URL 도 없으면 source_id 자체를 묶음으로 본다.
  source_groups:
    turboquant-paper: google          # Amir Zandieh — Google Research
    turboquant-blog: google           # Google Research Blog
    itme-paper: skhynix               # Hakbeom Jang — Memory Systems Research, SK hynix
    skhynix-cmm-validation: skhynix   # SK hynix Newsroom
    infinigen-paper: snu              # Wonbeom Lee — Seoul National University
    pim-cxl-paper: hanyang            # Dowon Kim — Hanyang University
    cxl-whitepaper: cxl-consortium
    vllm-quantized-kvcache: vllm
    vllm-prefix-caching: vllm
    kv-cache-survey: kv-cache-survey  # 1저자 소속이 첫 쪽에 없다 — 독립 묶음으로 둔다
  # 사전 정의 편향 예외. 지표 ①② 가 실패해도 이 기술이면 보고서 §6 에 사유·조사 범위를
  # 공개하는 것으로 처리한다. ③(선택적 근거 사용)은 예외와 무관하게 매번 검사한다.
  exceptions:
    - technology: ITME
      reason: "ITME 직접 원문은 SK hynix 1저자 논문 1편과 SK hynix 뉴스룸뿐이며, 다른 출처 묶음의 ITME 직접 자료가 공개돼 있지 않다"
      scope: "papers_core·ecosystem 색인 전체와 이번 실행의 이해관계자 웹 수집"
